<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notion 月曆｜Taipei</title>
<style>
:root{color-scheme:light;font-family:Arial,'Noto Sans TC','PingFang TC',sans-serif;--accent:#e56e67;--ink:#252525;--muted:#a5a5a5;--line:#e9e7e4}
*{box-sizing:border-box}html,body{margin:0;width:100%;background:transparent}body{padding:5px}
.calendar{width:100%;max-width:560px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:13px;padding:23px 18px 19px;color:var(--ink);overflow:hidden}
.calendar:before{content:'';display:block;border-top:3px dotted #e9e4e0;margin:-11px 0 17px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.year{font-size:13px;font-weight:800;letter-spacing:.16em}.month{font-size:clamp(19px,5vw,27px);font-weight:800;letter-spacing:.09em;color:var(--accent);margin-top:3px}.controls{display:flex;gap:5px}.nav{width:31px;height:31px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer;font-size:18px}.nav:hover{background:#fff2f1}.today-button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:11px;cursor:pointer;padding:5px 0}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.weekdays{margin-top:21px;border-bottom:1px solid var(--line);padding-bottom:10px}.weekdays span{font-size:11px;font-weight:700;color:#8a8a8a}.days{margin-top:8px;row-gap:5px}.cell{min-height:59px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7px 1px 3px;font-size:clamp(12px,3.5vw,17px);font-weight:600;border-radius:10px;font-variant-numeric:tabular-nums;gap:3px}.date-number{line-height:1.1}.lunar-day{font-size:clamp(8px,2.4vw,11px);font-weight:400;line-height:1.25;white-space:nowrap}.event{font-size:clamp(8px,2.4vw,10px);font-weight:750;color:#d66d65;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cell.today .event,.cell.today .lunar-day{color:#fff}.cell.outside .lunar-day,.cell.outside .event{opacity:.35}.cell.outside{color:#ccc}.cell.today{background:var(--accent);color:white;font-weight:900}.cell.current:not(.today){color:var(--ink)}.cell.current.sunday{color:#d66d65}.legend{margin-top:12px;font-size:10px;color:#929292;line-height:1.5}.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}.today-label{font-size:12px;font-weight:700}.tz{font-size:10px;letter-spacing:.04em;color:var(--muted)}
@media(max-width:290px){.calendar{padding:19px 10px 14px}.cell{border-radius:7px;min-height:52px;padding:6px 0 2px}.top{align-items:flex-start}.nav{width:27px;height:27px}.today-label{font-size:10px}}
</style>
</head>
<body>
<main class="calendar" aria-label="月份月曆">
 <header class="top"><div><div class="year" id="year"></div><div class="month" id="month"></div></div><div class="controls"><button class="nav" id="prev" aria-label="上個月">‹</button><button class="nav" id="next" aria-label="下個月">›</button></div></header>
 <div class="weekdays"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div>
 <div class="days" id="days"></div>
 <div class="legend">每日農曆 · 節氣與常見節慶（非政府放假公告）</div>
 <footer class="bottom"><div><div class="today-label" id="todayLabel"></div><button class="today-button" id="reset">回到本月 · TODAY</button></div><span class="tz">ASIA / TAIPEI</span></footer>
</main>
<script>
(()=>{
 const TZ='Asia/Taipei';
 const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
 const monthNames=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
 const lunarFmt=new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{timeZone:TZ,month:'long',day:'numeric'});
 const solarNames=['小寒','大寒','立春','雨水','驚蟄','春分','清明','穀雨','立夏','小滿','芒種','夏至','小暑','大暑','立秋','處暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
 const solarMinutes=[0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];
 const solarCache=new Map();
 function solarTerms(y){if(solarCache.has(y))return solarCache.get(y);const map=new Map();for(let i=0;i<24;i++){const instant=new Date(Date.UTC(1900,0,6,2,5)+31556925974.7*(y-1900)+solarMinutes[i]*60000);const ps=Object.fromEntries(fmt.formatToParts(instant).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]));map.set(`${ps.year}-${ps.month}-${ps.day}`,solarNames[i]);}solarCache.set(y,map);return map;}
 function lunarInfo(date){const pieces=lunarFmt.formatToParts(date);const month=pieces.find(p=>p.type==='month')?.value||'';const raw=pieces.find(p=>p.type==='day')?.value||'';const n=Number(raw);const digits=['一','二','三','四','五','六','七','八','九','十'];const day=Number.isInteger(n)&&n>=1&&n<=30?(n<=10?'初'+digits[n-1]:n<20?'十'+digits[n-11]:n===20?'二十':n<30?'廿'+digits[n-21]:'三十'):raw;return {month,day};}
 const fixedEvents={'1-1':'元旦','2-14':'情人節','2-28':'和平紀念日','3-8':'婦女節','4-4':'兒童節','5-1':'勞動節','10-10':'國慶日','10-31':'萬聖節','12-25':'聖誕節'};
 const lunarEvents={'1-1':'春節','1-2':'初二','1-3':'初三','1-15':'元宵節','5-5':'端午節','7-7':'七夕','7-15':'中元節','8-15':'中秋節','9-9':'重陽節','12-8':'臘八節'};
 function lunarEvent(info,date){const mo=info.month.replace(/[^0-9一二三四五六七八九十正冬臘]/g,'');const nums={'正':1,'冬':11,'臘':12,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};const m=/\d+/.test(mo)?Number(mo.match(/\d+/)[0]):nums[mo];const days={'初一':1,'初二':2,'初三':3,'初五':5,'初七':7,'初八':8,'十五':15};const d=days[info.day];if(info.month.includes('閏'))return '';if(m&&d&&lunarEvents[`${m}-${d}`])return lunarEvents[`${m}-${d}`];const tomorrow=new Date(date.getTime()+86400000);const next=lunarInfo(tomorrow);if(next.month.match(/正|一|1/) && next.day==='初一' && (m===12||m===11))return '除夕';return '';}
 const weekdayNames=['SUN','MON','TUE','WED','THU','FRI','SAT'];
 const parts=()=>{const p=Object.fromEntries(fmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]));return {y:p.year,m:p.month-1,d:p.day}};
 let today=parts();let viewY=today.y,viewM=today.m;
 const el=id=>document.getElementById(id);
 const shift=delta=>{const d=new Date(Date.UTC(viewY,viewM+delta,1));viewY=d.getUTCFullYear();viewM=d.getUTCMonth();render()};
 function render(){
  el('year').textContent=viewY;
  el('month').textContent=monthNames[viewM];
  el('todayLabel').textContent=`TODAY · ${today.y}.${String(today.m+1).padStart(2,'0')}.${String(today.d).padStart(2,'0')} ${weekdayNames[new Date(Date.UTC(today.y,today.m,today.d)).getUTCDay()]}`;
  const first=new Date(Date.UTC(viewY,viewM,1));const offset=(first.getUTCDay()+6)%7;
  const total=new Date(Date.UTC(viewY,viewM+1,0)).getUTCDate();
  const cells=Math.ceil((offset+total)/7)*7;const grid=el('days');grid.replaceChildren();
  for(let i=0;i<cells;i++){
   const date=new Date(Date.UTC(viewY,viewM,1-offset+i));const y=date.getUTCFullYear(),m=date.getUTCMonth(),d=date.getUTCDate();
   const current=m===viewM;const isToday=y===today.y&&m===today.m&&d===today.d;
   const cell=document.createElement('div');cell.className=`cell ${current?'current':'outside'} ${date.getUTCDay()===0?'sunday':''} ${isToday?'today':''}`;
   const number=document.createElement('span');number.className='date-number';number.textContent=d;cell.appendChild(number);
   const lunar=lunarInfo(date);const lunarLine=document.createElement('span');lunarLine.className='lunar-day';lunarLine.textContent=lunar.day==='初一'?lunar.month:lunar.day;cell.appendChild(lunarLine);
   const key=`${y}-${m+1}-${d}`;const event=solarTerms(y).get(key)||lunarEvent(lunar,date)||fixedEvents[`${m+1}-${d}`]||'';
   if(event){const tag=document.createElement('span');tag.className='event';tag.textContent=event;cell.appendChild(tag)}
   cell.title=`${y}/${m+1}/${d} · 農曆${lunar.month}${lunar.day}${event?' · '+event:''}`;
   if(isToday)cell.setAttribute('aria-label',`今天 ${y}年${m+1}月${d}日`);
   grid.appendChild(cell);
  }
 }
 el('prev').addEventListener('click',()=>shift(-1));el('next').addEventListener('click',()=>shift(1));
 el('reset').addEventListener('click',()=>{viewY=today.y;viewM=today.m;render()});
 render();setInterval(()=>{const now=parts();if(now.y!==today.y||now.m!==today.m||now.d!==today.d){const followingToday=viewY===today.y&&viewM===today.m;today=now;if(followingToday){viewY=now.y;viewM=now.m}render()}},15000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){const now=parts();if(now.y!==today.y||now.m!==today.m||now.d!==today.d){const followingToday=viewY===today.y&&viewM===today.m;today=now;if(followingToday){viewY=now.y;viewM=now.m}render()}}});
})();
</script>
</body>
</html>
