<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notion 月曆｜Taipei</title>
<style>
:root{color-scheme:light;font-family:Arial,'Noto Sans TC','PingFang TC',sans-serif;--accent:#e56e67;--ink:#252525;--muted:#a5a5a5;--line:#e9e7e4}
*{box-sizing:border-box}html,body{margin:0;width:100%;background:transparent}body{padding:5px}
.calendar{width:100%;max-width:560px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:13px;padding:23px 18px 19px;color:var(--ink);overflow:hidden}
.calendar:before{content:'';display:block;border-top:3px dotted #e9e4e0;margin:-11px 0 17px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.year{font-size:13px;font-weight:800;letter-spacing:.16em}.month{font-size:clamp(19px,5vw,27px);font-weight:800;letter-spacing:.09em;color:var(--accent);margin-top:3px}.controls{display:flex;gap:5px}.nav{width:31px;height:31px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer;font-size:18px}.nav:hover{background:#fff2f1}.today-button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:11px;cursor:pointer;padding:5px 0}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.weekdays{margin-top:21px;border-bottom:1px solid var(--line);padding-bottom:10px}.weekdays span{font-size:11px;font-weight:700;color:#8a8a8a}.days{margin-top:8px;row-gap:5px}.cell{aspect-ratio:1;min-height:29px;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,3.5vw,17px);font-weight:600;border-radius:10px;font-variant-numeric:tabular-nums}.cell.outside{color:#ccc}.cell.today{background:var(--accent);color:white;font-weight:900}.cell.current:not(.today){color:var(--ink)}.cell.current.sunday{color:#d66d65}.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}.today-label{font-size:12px;font-weight:700}.tz{font-size:10px;letter-spacing:.04em;color:var(--muted)}
@media(max-width:290px){.calendar{padding:19px 10px 14px}.cell{border-radius:7px;min-height:23px}.top{align-items:flex-start}.nav{width:27px;height:27px}.today-label{font-size:10px}}
</style>
</head>
<body>
<main class="calendar" aria-label="月份月曆">
 <header class="top"><div><div class="year" id="year"></div><div class="month" id="month"></div></div><div class="controls"><button class="nav" id="prev" aria-label="上個月">‹</button><button class="nav" id="next" aria-label="下個月">›</button></div></header>
 <div class="weekdays"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div>
 <div class="days" id="days"></div>
 <footer class="bottom"><div><div class="today-label" id="todayLabel"></div><button class="today-button" id="reset">回到本月 · TODAY</button></div><span class="tz">ASIA / TAIPEI</span></footer>
</main>
<script>
(()=>{
 const TZ='Asia/Taipei';
 const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
 const monthNames=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
 const weekdayNames=['SUN','MON','TUE','WED','THU','FRI','SAT'];
 const parts=()=>{const p=Object.fromEntries(fmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]));return {y:p.year,m:p.month-1,d:p.day}};
 let today=parts();let viewY=today.y,viewM=today.m;
 const el=id=>document.getElementById(id);
 const shift=delta=>{const d=new Date(Date.UTC(viewY,viewM+delta,1));viewY=d.getUTCFullYear();viewM=d.getUTCMonth();render()};
 function render(){
  el('year').textContent=viewY;
  el('month').textContent=monthNames[viewM];
  el('todayLabel').textContent=`TODAY · ${today.y}.${String(today.m+1).padStart(2,'0')}.${String(today.d).padStart(2,'0')} ${weekdayNames[new Date(Date.UTC(today.y,today.m,today.d)).getUTCDay()]}`;
  const first=new Date(Date.UTC(viewY,viewM,1));const offset=(first.getUTCDay()+6)%7;
  const total=new Date(Date.UTC(viewY,viewM+1,0)).getUTCDate();
  const cells=Math.ceil((offset+total)/7)*7;const grid=el('days');grid.replaceChildren();
  for(let i=0;i<cells;i++){
   const date=new Date(Date.UTC(viewY,viewM,1-offset+i));const y=date.getUTCFullYear(),m=date.getUTCMonth(),d=date.getUTCDate();
   const current=m===viewM;const isToday=y===today.y&&m===today.m&&d===today.d;
   const cell=document.createElement('div');cell.className=`cell ${current?'current':'outside'} ${date.getUTCDay()===0?'sunday':''} ${isToday?'today':''}`;cell.textContent=d;
   if(isToday)cell.setAttribute('aria-label',`今天 ${y}年${m+1}月${d}日`);
   grid.appendChild(cell);
  }
 }
 el('prev').addEventListener('click',()=>shift(-1));el('next').addEventListener('click',()=>shift(1));
 el('reset').addEventListener('click',()=>{viewY=today.y;viewM=today.m;render()});
 render();setInterval(()=>{const now=parts();if(now.y!==today.y||now.m!==today.m||now.d!==today.d){const followingToday=viewY===today.y&&viewM===today.m;today=now;if(followingToday){viewY=now.y;viewM=now.m}render()}},15000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){const now=parts();if(now.y!==today.y||now.m!==today.m||now.d!==today.d){const followingToday=viewY===today.y&&viewM===today.m;today=now;if(followingToday){viewY=now.y;viewM=now.m}render()}}});
})();
</script>
</body>
</html>
